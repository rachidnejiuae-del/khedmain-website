<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Installer Khedmain — تثبيت التطبيق</title>
<meta name="robots" content="noindex" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#17283A" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Tajawal:wght@500;700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  *{margin:0;box-sizing:border-box;}
  body{font-family:'Inter','Tajawal',system-ui,sans-serif;color:#fff;min-height:100vh;
    background:radial-gradient(circle at 15% 10%,rgba(29,95,214,.25),transparent 40%),
               radial-gradient(circle at 88% 85%,rgba(255,122,47,.20),transparent 42%),
               linear-gradient(160deg,#17283A 0%,#0E1A26 100%);
    padding:26px 16px 60px;}
  [dir="rtl"] body{font-family:'Tajawal',system-ui,sans-serif;}
  .wrap{max-width:560px;margin:0 auto;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .badge{width:46px;height:46px;border-radius:13px;background:linear-gradient(145deg,#FF9552,#E85D14);
    display:grid;place-items:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;color:#fff;
    box-shadow:0 8px 20px rgba(232,93,20,.45);}
  .wm{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;direction:ltr;}
  .wm .in{color:#4F8BF0;}
  .lang{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;
    border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;}
  h1{font-size:26px;font-weight:800;margin-bottom:6px;}
  .sub{color:rgba(255,255,255,.72);font-size:15px;margin-bottom:26px;line-height:1.5;}
  .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;
    padding:20px;margin-bottom:16px;}
  .card.on{border-color:#FF7A2F;background:rgba(255,122,47,.10);}
  .card h2{font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .card h2 .os{font-size:22px;}
  ol{margin:0;padding-inline-start:22px;}
  ol li{margin-bottom:10px;font-size:15px;line-height:1.5;color:rgba(255,255,255,.9);}
  .btn{display:block;width:100%;background:#FF7A2F;color:#fff;border:none;border-radius:999px;
    padding:14px;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit;margin-top:6px;}
  .btn:active{transform:translateY(1px);}
  .btn[disabled]{opacity:.5;}
  .hint{font-size:13px;color:rgba(255,255,255,.6);margin-top:10px;line-height:1.5;}
  .share{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;
    background:rgba(255,255,255,.15);vertical-align:middle;}
  .back{display:inline-block;margin-top:18px;color:rgba(255,255,255,.7);font-weight:700;font-size:14px;text-decoration:none;}
  .back:hover{color:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="badge">K</span><span class="wm">khedma<span class="in">in</span></span></div>
    <button class="lang" id="lang"></button>
  </div>

  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>

  <div class="card" id="cardAndroid">
    <h2><span class="os">🤖</span><span id="aTitle"></span></h2>
    <button class="btn" id="installBtn" style="display:none"></button>
    <ol id="aSteps"></ol>
  </div>

  <div class="card" id="cardIos">
    <h2><span class="os"></span><span id="iTitle"></span></h2>
    <ol id="iSteps"></ol>
  </div>

  <a class="back" id="back" href="/"></a>
</div>

<script>
var L = {
  ar: {
    dir:'rtl', toggle:'FR',
    h1:'ثبّت تطبيق خدمة إن',
    sub:'استعمل خدمة إن كتطبيق على هاتفك: أيقونة على الشاشة الرئيسية وفتح بملء الشاشة. اختر نظام هاتفك بالأسفل.',
    aTitle:'على أندرويد (Chrome)',
    aBtn:'📲 تثبيت التطبيق الآن',
    aSteps:['اضغط زر « تثبيت التطبيق » بالأعلى.',
            'إذا لم يظهر الزر: افتح قائمة المتصفح ⋮ (أعلى اليمين) ثم اختر « تثبيت التطبيق » أو « إضافة إلى الشاشة الرئيسية ».',
            'أكّد، وستظهر أيقونة خدمة إن على شاشتك الرئيسية.'],
    iTitle:'على آيفون (Safari)',
    iSteps:['افتح khedmain.com في متصفّح Safari.',
            'اضغط زر المشاركة ⬆︎ في الأسفل.',
            'اختر « إضافة إلى الشاشة الرئيسية » (Add to Home Screen).',
            'اضغط « إضافة »، وستظهر أيقونة خدمة إن على شاشتك.'],
    back:'→ الرجوع إلى الموقع'
  },
  fr: {
    dir:'ltr', toggle:'ع',
    h1:'Installer l’application Khedmain',
    sub:'Utilisez Khedmain comme une app sur votre téléphone : une icône sur l’écran d’accueil, en plein écran. Choisissez votre système ci-dessous.',
    aTitle:'Sur Android (Chrome)',
    aBtn:'📲 Installer l’application',
    aSteps:['Touchez le bouton « Installer l’application » ci-dessus.',
            'Si le bouton n’apparaît pas : ouvrez le menu ⋮ du navigateur (en haut à droite) puis « Installer l’application » ou « Ajouter à l’écran d’accueil ».',
            'Confirmez : l’icône Khedmain apparaît sur votre écran d’accueil.'],
    iTitle:'Sur iPhone (Safari)',
    iSteps:['Ouvrez khedmain.com dans Safari.',
            'Touchez le bouton Partager ⬆︎ en bas.',
            'Choisissez « Sur l’écran d’accueil » (Add to Home Screen).',
            'Touchez « Ajouter » : l’icône Khedmain apparaît sur votre écran.'],
    back:'→ Retour au site'
  }
};

var lang = 'ar';
try { lang = localStorage.getItem('kd_lang') || 'ar'; } catch (e) {}

function render() {
  var t = L[lang] || L.ar;
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;
  document.getElementById('lang').textContent = t.toggle;
  document.getElementById('h1').textContent = t.h1;
  document.getElementById('sub').textContent = t.sub;
  document.getElementById('aTitle').textContent = t.aTitle;
  document.getElementById('iTitle').textContent = t.iTitle;
  document.querySelector('#cardIos .os').textContent = '';
  document.getElementById('aSteps').innerHTML = t.aSteps.map(function(s){return '<li>'+s+'</li>';}).join('');
  document.getElementById('iSteps').innerHTML = t.iSteps.map(function(s){return '<li>'+s+'</li>';}).join('');
  document.getElementById('installBtn').textContent = t.aBtn;
  document.getElementById('back').textContent = t.back;
  // emphasise the user's platform
  var ua = navigator.userAgent || '';
  var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  document.getElementById('cardIos').classList.toggle('on', isIOS);
  document.getElementById('cardAndroid').classList.toggle('on', !isIOS);
}

document.getElementById('lang').addEventListener('click', function () {
  lang = (lang === 'ar') ? 'fr' : 'ar';
  try { localStorage.setItem('kd_lang', lang); } catch (e) {}
  render();
});

// Android direct install, when the browser offers it
var deferred = null;
var btn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  deferred = e;
  btn.style.display = 'block';
});
btn.addEventListener('click', function () {
  if (!deferred) return;
  deferred.prompt();
  deferred.userChoice.then(function () { deferred = null; btn.style.display = 'none'; });
});
window.addEventListener('appinstalled', function () {
  try { localStorage.setItem('kd_pwa_installed', '1'); } catch (e) {}
  btn.style.display = 'none';
});

render();
</script>
</body>
</html>
